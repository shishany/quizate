# Local development only. Images are pinned; credentials are local placeholders that match the .env.example files.
name: quizate

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: quizate
      POSTGRES_PASSWORD: quizate
      POSTGRES_DB: quizate
    ports: ['5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quizate -d quizate']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. MinIO no longer publishes community images, so RustFS stands in locally;
  # the API only speaks the S3 API (see docs/ARCHITECTURE.md).
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: quizate
      RUSTFS_SECRET_KEY: quizate-local-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['9000:9000', '9001:9001']
    volumes: [storage-data:/data]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:9000/health || wget -qO- http://localhost:9000/health',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init:
    image: amazon/aws-cli:2.31.3
    depends_on:
      storage: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: quizate
      AWS_SECRET_ACCESS_KEY: quizate-local-secret
      AWS_DEFAULT_REGION: me-central-1
    entrypoint: ['/bin/sh', '-c']
    command:
      - aws --endpoint-url http://storage:9000 s3api head-bucket --bucket quizate-local 2>/dev/null
        || aws --endpoint-url http://storage:9000 s3 mb s3://quizate-local
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  storage-data:
